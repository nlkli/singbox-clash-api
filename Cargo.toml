[package]
name = "singbox-clash-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async Rust client for the Clash-compatible REST API of sing-box"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["sing-box", "clash", "proxy", "api-client", "tokio"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
# Async runtime: only the timer is needed directly; networking comes via hyper-util.
tokio = { version = "1", default-features = false, features = ["time"] }
# HTTP/1.1 only, no TLS (the sing-box controller speaks plain HTTP).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
